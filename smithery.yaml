# Smithery.ai configuration for GoldBean MCP Server
# https://smithery.ai/docs/build/project-config

# GoldBean is hosted remotely at https://goldbean-api.xyz
# Use URL mode for external hosting
startCommand:
  type: "url"
  url: "https://goldbean-api.xyz/sse"
  configSchema:
    type: "object"
    properties: {}
    required: []

# Alternative: URL-based server card for static metadata
# Supports x402 micropayments via Base USDC
description: |
  GoldBean MCP Server — Pay-per-call AI API gateway with 47 endpoints.
  Access Baidu AI (OCR, TTS, ASR, Translation, LLM Chat, HelixFold3, Image Recognition),
  web search, crypto prices, weather, and more via a single SSE endpoint.
  Payment: x402 micropayments (Base USDC), PayPal, Alipay.
  Free tier: 50 calls/day. Starting at $0.01/call. No KYC.
  Docs: https://goldbean-api.xyz
license: MIT
