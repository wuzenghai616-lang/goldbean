<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GoldBean 代理仪表盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#0f0f1a;color:#e0e0e0;padding:20px}
.card{background:#1a1a2e;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #2a2a4a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{text-align:center;padding:16px}
.stat .value{font-size:28px;font-weight:700;color:#7c3aed}
.stat .label{font-size:13px;color:#888;margin-top:4px}
h1{font-size:22px;margin-bottom:20px;color:#fff}
h2{font-size:16px;margin-bottom:12px;color:#ccc}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;border-bottom:2px solid #2a2a4a;color:#7c3aed;font-weight:600}
td{padding:8px 12px;border-bottom:1px solid #232340}
tr:hover td{background:#232340}
.footer{text-align:center;color:#555;font-size:12px;margin-top:30px}
</style></head>
<body>
<h1>🫘 GoldBean 代理仪表盘</h1>
<div class="grid">
  <div class="card stat"><div class="value" id="totalCalls">-</div><div class="label">历史调用</div></div>
  <div class="card stat"><div class="value" id="totalRevenue">-</div><div class="label">总收入 (USDC)</div></div>
  <div class="card stat"><div class="value" id="todayCalls">-</div><div class="label">今日调用</div></div>
  <div class="card stat"><div class="value" id="referCount">-</div><div class="label">代理数</div></div>
</div>
<div class="card"><h2>📊 热门端点</h2><table><thead><tr><th>端点</th><th>调用</th><th>收入</th></tr></thead><tbody id="endpointList"></tbody></table></div>
<div class="card"><h2>🤝 代理商</h2><table><thead><tr><th>代理ID</th><th>钱包</th><th>客户数</th><th>创建</th></tr></thead><tbody id="referralList"></tbody></table></div>
<div class="card"><h2>📈 趋势</h2><table><tbody id="trendList"></tbody></table></div>
<div class="footer">GoldBean v7.8.0 &mdash; <a href="https://goldbean-api.xyz" style="color:#7c3aed">goldbean-api.xyz</a></div>
<script>
async function load(){
  try{
    document.getElementById("endpointList").innerHTML="<tr><td colspan=3 style=color:#666>加载中...</td></tr>";
    var r=await fetch("/paid/referral-stats");
    var d=await r.json();
    var rev=d.revenue||{},rr=d.referrals||{};
    document.getElementById("totalCalls").textContent=(rev.summary&&rev.summary.all_time.calls)||0;
    document.getElementById("totalRevenue").textContent="$"+(rev.summary&&rev.summary.all_time.revenue_usd||"0.00");
    document.getElementById("todayCalls").textContent=(rev.summary&&rev.summary.today&&rev.summary.today.calls)||0;
    document.getElementById("referCount").textContent=Object.keys(rr).length;
    var eps="";
    (rev.top_endpoints||[]).slice(0,15).forEach(function(e){eps+="<tr><td>"+e.ep+"</td><td>"+(e.count||0)+"</td><td>$"+(e.revenue||0).toFixed(2)+"</td></tr>";});
    document.getElementById("endpointList").innerHTML=eps||"<tr><td colspan=3 style=color:#666>暂无数据</td></tr>";
    var refs="";
    Object.keys(rr).forEach(function(k){var r=rr[k];refs+="<tr><td>"+k+"</td><td>"+(r.wallet||"-").substring(0,16)+"..</td><td>"+(r.referrals||[]).length+"</td><td>"+(r.created||"").substring(0,10)+"</td></tr>";});
    document.getElementById("referralList").innerHTML=refs||"<tr><td colspan=4 style=color:#666>暂无代理商</td></tr>";
    var tr="";
    if(rev.trend){tr+="<tr><td>上次总营收</td><td>$"+rev.trend.prev_total_revenue+"</td></tr>";tr+="<tr><td>新增调用</td><td>"+rev.trend.new_calls_since_prev+"</td></tr>";}
    document.getElementById("trendList").innerHTML=tr||"<tr><td colspan=2 style=color:#666>暂无趋势数据</td></tr>";
  }catch(e){document.getElementById("endpointList").innerHTML="<tr><td colspan=3><font color=red>加载失败: "+e.message+"</font></td></tr>";}
}
load();
</script>
</body></html>
